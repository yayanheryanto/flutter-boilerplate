targets:
  $default:
    builders:
      injectable_generator:injectable_builder:
        generate_for:
          include:
            - lib/core/**/*.dart
            - lib/features/**/*.dart
        options:
          auto_register: true

      freezed:
        generate_for:
          include:
            - lib/features/**/*_model.dart
        # If you have no other options, you can omit the options block entirely

      json_serializable:
        generate_for:
          include:
            - lib/features/**/*_model.dart
        options:
          any_map: false
          checked: true
          create_factory: true
          create_to_json: true
          explicit_to_json: true
          field_rename: snake

      retrofit_generator:
        generate_for:
          include:
            - lib/features/**/*_datasource.dart